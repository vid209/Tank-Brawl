<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TANK BRAWL</title>
    <style>
        * { user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #0a1a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            touch-action: none;
            overflow: hidden;
            width: 100%;
            height: 100%;
            position: fixed;
        }
        .menu {
            background: #1e2a1c;
            border: 3px solid #e9b45e;
            border-radius: 32px;
            padding: 18px;
            max-width: 480px;
            width: 92%;
            text-align: center;
            max-height: 95vh;
            overflow-y: auto;
        }
        .menu h1 { font-size: 1.5rem; color: #f7e9c3; margin: 0 0 10px; }
        .menu h2 { font-size: 0.9rem; color: #cfc68f; margin: 12px 0 5px; }
        .mode-btn {
            background: #2f3a28;
            border: none;
            padding: 11px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            color: #ffeaac;
            font-family: monospace;
            width: 100%;
            margin: 4px 0;
            touch-action: manipulation;
        }
        .mode-btn:active { transform: scale(0.97); }
        .mode-btn.bots { background: #3a6e3a; }
        .mode-btn.ctf { background: #2a6e5a; }
        .mode-btn.pvp { background: #8b5a2a; }
        .mode-btn.online { background: #3a5a8a; }
        .mode-btn.selected { background: #d9a13b; color: #1a2a0e; box-shadow: 0 0 12px #ffcc66; }
        .map-btn {
            background: #3a2a4a;
            border: 2px solid #8a6aaa;
            border-radius: 30px;
            padding: 8px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            color: #e8ccff;
            font-family: monospace;
            width: 48%;
            margin: 3px 1%;
            touch-action: manipulation;
            display: inline-block;
        }
        .map-btn:active { transform: scale(0.97); }
        .map-btn.selected { background: #8a5aaa; color: #fff; box-shadow: 0 0 12px #cc88ff; }
        .players-btn {
            background: #2a4a5a;
            border: 2px solid #6aaaaa;
            border-radius: 30px;
            padding: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            color: #cceeff;
            font-family: monospace;
            width: 30%;
            margin: 3px 1%;
            touch-action: manipulation;
            display: inline-block;
        }
        .players-btn.selected { background: #4a8aaa; color: #fff; box-shadow: 0 0 12px #88ccff; }
        .network-panel {
            background: #0e180c;
            border-radius: 20px;
            padding: 12px;
            margin-top: 8px;
        }
        .network-panel input {
            background: #2c2a1c;
            border: 2px solid #b99a4a;
            padding: 9px;
            border-radius: 30px;
            font-family: monospace;
            color: #ffeaaf;
            font-size: 0.85rem;
            width: 100%;
            margin: 4px 0;
            text-align: center;
        }
        .status-text {
            color: #cfc68f;
            font-size: 0.7rem;
            margin-top: 6px;
            text-align: center;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100vh;
            padding: 4px;
            touch-action: none;
        }
        .info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            padding: 6px 14px;
            background: #1e1b14cc;
            border-radius: 30px;
            color: #f7ecc7;
            font-weight: bold;
            font-size: 0.75rem;
            margin-bottom: 4px;
            flex-shrink: 0;
        }
        canvas {
            box-shadow: 0 0 0 3px #ab8743, 0 10px 25px black;
            border-radius: 14px;
            width: 100%;
            height: auto;
            max-width: 800px;
            touch-action: none;
            background: #2d2a24;
            flex-shrink: 0;
        }
        .touch-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            padding: 8px 12px;
            margin-top: 6px;
            flex-shrink: 0;
            gap: 12px;
            background: #1a1a14aa;
            border-radius: 30px;
            backdrop-filter: blur(4px);
        }
        .dpad {
            display: grid;
            grid-template-columns: 70px 70px 70px;
            grid-template-rows: 70px 70px 70px;
            gap: 4px;
            touch-action: none;
        }
        .dpad-btn {
            background: #2c241a;
            border: 2px solid #b99a4a;
            border-radius: 16px;
            color: #ffeaac;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            cursor: pointer;
            box-shadow: 0 3px 0 #5a3a1a;
        }
        .dpad-btn:active { transform: scale(0.93); box-shadow: 0 1px 0 #5a3a1a; }
        .dpad-center {
            background: transparent;
            border: none;
            box-shadow: none;
            cursor: default;
            color: #5a5a4a;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }
        .fire-btn {
            background: #8b2a1a;
            border: 3px solid #ff6644;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            font-size: 2.2rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            cursor: pointer;
            box-shadow: 0 4px 0 #4a150a;
        }
        .fire-btn:active { transform: scale(0.92); box-shadow: 0 1px 0 #4a150a; }
        .small-btn {
            background: #3a5a3a;
            border: 2px solid #88aa44;
            border-radius: 30px;
            padding: 6px 16px;
            color: #ffeaac;
            font-size: 0.7rem;
            font-weight: bold;
            touch-action: none;
            cursor: pointer;
            font-family: monospace;
            width: 80px;
        }
        .small-btn:active { transform: scale(0.95); }
        .back-btn {
            background: #5a4a2e;
            border: 2px solid #b99a4a;
            border-radius: 30px;
            padding: 6px 16px;
            color: #ffeaac;
            font-size: 0.7rem;
            font-weight: bold;
            touch-action: none;
            cursor: pointer;
            font-family: monospace;
            width: 80px;
        }
        .back-btn:active { transform: scale(0.95); }
        @media (min-width: 860px) {
            .touch-controls { display: none; }
        }
        @media (max-width: 550px) {
            .dpad { grid-template-columns: 55px 55px 55px; grid-template-rows: 55px 55px 55px; gap: 3px; }
            .dpad-btn { font-size: 1.4rem; border-radius: 12px; }
            .fire-btn { width: 65px; height: 65px; font-size: 1.8rem; }
            .small-btn, .back-btn { width: 65px; font-size: 0.6rem; padding: 4px 10px; }
            .info { font-size: 0.6rem; padding: 4px 10px; }
        }
        @media (max-width: 400px) {
            .dpad { grid-template-columns: 44px 44px 44px; grid-template-rows: 44px 44px 44px; gap: 2px; }
            .dpad-btn { font-size: 1rem; border-radius: 10px; }
            .fire-btn { width: 55px; height: 55px; font-size: 1.4rem; }
            .small-btn, .back-btn { width: 55px; font-size: 0.5rem; padding: 3px 6px; }
            .info { font-size: 0.5rem; padding: 3px 8px; }
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div id="menu" class="menu">
    <h1> TANK BRAWL </h1>
    
    <h2>🎮 Способ игры:</h2>
    <button class="mode-btn bots" id="btnOffline" onclick="selectSource('offline', this)">🎮 ОФЛАЙН (на 1 ПК)</button>
    <button class="mode-btn online" id="btnOnline" onclick="selectSource('online', this)">🌐 ПО СЕТИ (Hamachi)</button>
    
    <div id="offlineModes" style="display:none;">
        <h2> Офлайн режим:</h2>
        <button class="mode-btn bots" data-mode="bots" onclick="selectMode('bots', this)">🎮 ПРОТИВ БОТОВ</button>
        <button class="mode-btn ctf" data-mode="ctf" onclick="selectMode('ctf', this)">🏁 ЗАХВАТ ФЛАГА</button>
        <button class="mode-btn pvp" data-mode="pvp" onclick="selectMode('pvp', this)">⚔️ PVP 2 ИГРОКА</button>
    </div>
    
    <div id="onlineModes" style="display:none;">
        <h2> Сетевой режим:</h2>
        <button class="mode-btn bots" data-mode="bots" onclick="selectMode('bots', this)">🌐 ПРОТИВ БОТОВ</button>
        <button class="mode-btn ctf" data-mode="ctf" onclick="selectMode('ctf', this)">🌐 ЗАХВАТ ФЛАГА</button>
        <button class="mode-btn pvp" data-mode="pvp" onclick="selectMode('pvp', this)">🌐 PVP (все против всех)</button>
        
        <h2>👥 Игроков:</h2>
        <div>
            <button class="players-btn" data-players="2" onclick="selectPlayers(2, this)">2</button>
            <button class="players-btn" data-players="4" onclick="selectPlayers(4, this)">4</button>
            <button class="players-btn" data-players="8" onclick="selectPlayers(8, this)">8</button>
        </div>
        
        <div id="networkPanel" class="network-panel">
            <input type="text" id="serverIp" placeholder="Hamachi-IP (25.x.x.x)" value="25.0.0.1">
            <input type="text" id="serverPort" placeholder="Порт" value="8080">
            <div id="netStatus" class="status-text">Введи Hamachi-IP сервера</div>
        </div>
    </div>
    
    <h2>🗺️ Карта:</h2>
    <div>
        <button class="map-btn" data-map="1" onclick="selectMap(1, this)">🗺️ Классика</button>
        <button class="map-btn" data-map="2" onclick="selectMap(2, this)">🗺️ Battle City</button>
        <button class="map-btn" data-map="3" onclick="selectMap(3, this)">🗺️ Лабиринт</button>
        <button class="map-btn" data-map="4" onclick="selectMap(4, this)">🗺️ Крепость</button>
    </div>
    
    <button id="startBtn" class="mode-btn online" style="margin-top:12px; font-size:1rem;" onclick="startSelectedMode()">▶ НАЧАТЬ ИГРУ</button>
</div>

<div id="game" class="game-container hidden">
    <div class="info">
        <span>❤️ <span id="healthValue">3</span></span>
        <span>⭐ <span id="scoreValue">0</span></span>
        <span id="modeLabel">🎮 РЕЖИМ</span>
        <span id="mapLabel">🗺️ Классика</span>
        <span id="playersLabel">👥 1</span>
    </div>
    <canvas id="canvas" width="800" height="600"></canvas>
    <div class="touch-controls" id="touchControls">
        <div class="dpad">
            <div class="dpad-btn" id="btnUp">▲</div>
            <div class="dpad-btn" id="btnLeft">◀</div>
            <div class="dpad-btn dpad-center">+</div>
            <div class="dpad-btn" id="btnRight">▶</div>
            <div class="dpad-btn" id="btnDown">▼</div>
        </div>
        <div class="action-buttons">
            <button class="fire-btn" id="btnFire">💥</button>
            <button class="small-btn" id="btnRestart">🔄 R</button>
            <button class="back-btn" id="backBtn">🏠 МЕНЮ</button>
        </div>
    </div>
    <div id="onlineStatus" class="status-text" style="margin-top:4px;color:#88aa44;"></div>
</div>

<script>
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    
    var currentMode = null;
    var gameSource = null;
    var gameRunning = false;
    var gameOver = false;
    var score = 0;
    var bricks = [];
    var ws = null;
    var myId = null;
    var players = new Map();
    var lastSend = 0;
    var currentMap = 1;
    var maxPlayers = 2;
    
    var selectedSource = null;
    var selectedMode = null;
    var selectedMap = 1;
    var selectedPlayers = 2;
    
    var p1 = { x: 380, y: 520, w: 40, h: 40, dir: 0, health: 3 };
    var p1Bullet = { active: false, x: 0, y: 0, speedX: 0, speedY: 0 };
    var p1Delay = 0;
    
    var p2 = null;
    var p2Bullet = { active: false, x: 0, y: 0, speedX: 0, speedY: 0 };
    var p2Delay = 0;
    
    var enemies = [];
    var flag = { x: 700, y: 80, w: 28, h: 28, captured: false, carrier: null };
    
    var keys = { left: false, right: false, up: false, down: false, fire: false };
    var keysP2 = { left: false, right: false, up: false, down: false, fire: false };
    
    var MAPS = {
        1: { name: 'Классика', build: function() {
            var arr = [];
            for (var i = 0; i < 20; i++) { arr.push({ x: i * 42, y: 0, w: 38, h: 38 }); arr.push({ x: i * 42, y: 562, w: 38, h: 38 }); }
            for (var i = 0; i < 15; i++) { arr.push({ x: 0, y: i * 42, w: 38, h: 38 }); arr.push({ x: 762, y: i * 42, w: 38, h: 38 }); }
            for (var i = 3; i < 18; i += 4) for (var j = 4; j < 10; j += 2) arr.push({ x: i * 42, y: j * 42, w: 38, h: 38 });
            return arr;
        }},
        2: { name: 'Battle City', build: function() {
            var arr = [];
            for (var i = 0; i < 20; i++) { arr.push({ x: i * 42, y: 0, w: 38, h: 38 }); arr.push({ x: i * 42, y: 562, w: 38, h: 38 }); }
            for (var i = 0; i < 15; i++) { arr.push({ x: 0, y: i * 42, w: 38, h: 38 }); arr.push({ x: 762, y: i * 42, w: 38, h: 38 }); }
            for (var i = 6; i <= 13; i++) { arr.push({ x: i * 42, y: 6 * 42, w: 38, h: 38 }); arr.push({ x: i * 42, y: 8 * 42, w: 38, h: 38 }); }
            for (var j = 3; j <= 6; j++) { arr.push({ x: 9 * 42, y: j * 42, w: 38, h: 38 }); arr.push({ x: 10 * 42, y: j * 42, w: 38, h: 38 }); }
            for (var j = 8; j <= 11; j++) { arr.push({ x: 9 * 42, y: j * 42, w: 38, h: 38 }); arr.push({ x: 10 * 42, y: j * 42, w: 38, h: 38 }); }
            arr.push({ x: 3*42, y: 3*42, w: 38, h: 38 }); arr.push({ x: 16*42, y: 3*42, w: 38, h: 38 });
            arr.push({ x: 3*42, y: 11*42, w: 38, h: 38 }); arr.push({ x: 16*42, y: 11*42, w: 38, h: 38 });
            return arr;
        }},
        3: { name: 'Лабиринт', build: function() {
            var arr = [];
            for (var i = 0; i < 20; i++) { arr.push({ x: i * 42, y: 0, w: 38, h: 38 }); arr.push({ x: i * 42, y: 562, w: 38, h: 38 }); }
            for (var i = 0; i < 15; i++) { arr.push({ x: 0, y: i * 42, w: 38, h: 38 }); arr.push({ x: 762, y: i * 42, w: 38, h: 38 }); }
            for (var j = 2; j <= 6; j++) { arr.push({ x: 4 * 42, y: j * 42, w: 38, h: 38 }); arr.push({ x: 15 * 42, y: j * 42, w: 38, h: 38 }); }
            for (var j = 8; j <= 12; j++) { arr.push({ x: 4 * 42, y: j * 42, w: 38, h: 38 }); arr.push({ x: 15 * 42, y: j * 42, w: 38, h: 38 }); }
            for (var i = 7; i <= 12; i++) { arr.push({ x: i * 42, y: 4 * 42, w: 38, h: 38 }); arr.push({ x: i * 42, y: 10 * 42, w: 38, h: 38 }); }
            return arr;
        }},
        4: { name: 'Крепость', build: function() {
            var arr = [];
            for (var i = 0; i < 20; i++) { arr.push({ x: i * 42, y: 0, w: 38, h: 38 }); arr.push({ x: i * 42, y: 562, w: 38, h: 38 }); }
            for (var i = 0; i < 15; i++) { arr.push({ x: 0, y: i * 42, w: 38, h: 38 }); arr.push({ x: 762, y: i * 42, w: 38, h: 38 }); }
            for (var i = 8; i <= 11; i++) { arr.push({ x: i * 42, y: 5 * 42, w: 38, h: 38 }); arr.push({ x: i * 42, y: 10 * 42, w: 38, h: 38 }); }
            for (var j = 6; j <= 9; j++) { arr.push({ x: 8 * 42, y: j * 42, w: 38, h: 38 }); arr.push({ x: 11 * 42, y: j * 42, w: 38, h: 38 }); }
            for (var i = 2; i <= 4; i++) for (var j = 2; j <= 4; j++) {
                arr.push({ x: i * 42, y: j * 42, w: 38, h: 38 }); arr.push({ x: (17 - i) * 42, y: j * 42, w: 38, h: 38 });
                arr.push({ x: i * 42, y: (13 - j) * 42, w: 38, h: 38 }); arr.push({ x: (17 - i) * 42, y: (13 - j) * 42, w: 38, h: 38 });
            }
            return arr;
        }}
    };
    
    function buildBricks() { return MAPS[currentMap].build(); }
    
    function collide(r1, r2) {
        return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
    }
    
    function updateUI() {
        document.getElementById('healthValue').innerText = p1.health;
        document.getElementById('scoreValue').innerText = score;
        document.getElementById('mapLabel').innerText = '🗺️ ' + MAPS[currentMap].name;
        document.getElementById('playersLabel').innerText = '👥 ' + (players.size + 1) + '/' + maxPlayers;
    }
    
    function restart() {
        gameOver = false;
        score = 0;
        p1 = { x: 380, y: 520, w: 40, h: 40, dir: 0, health: 3 };
        p1Bullet = { active: false, x: 0, y: 0, speedX: 0, speedY: 0 };
        p1Delay = 0;
        bricks = buildBricks();
        flag = { x: 700, y: 80, w: 28, h: 28, captured: false, carrier: null };
        enemies = [];
        
        // В офлайне ИЛИ в сетевом режиме "боты/флаг" спавним ботов
        if (currentMode === 'pvp' && gameSource === 'offline') {
            p2 = { x: 380, y: 80, w: 40, h: 40, dir: 1, health: 3 };
            p2Bullet = { active: false, x: 0, y: 0, speedX: 0, speedY: 0 };
            p2Delay = 0;
        } else if (currentMode === 'bots' || currentMode === 'ctf') {
            for (var i = 0; i < 3; i++) {
                enemies.push({ x: 100 + i * 250, y: 80, w: 40, h: 40, dir: 1, moveTimer: 0, shootTimer: Math.floor(Math.random() * 50) });
            }
        }
        updateUI();
    }
    
    function moveTank(tank, dx, dy, newDir) {
        var newX = tank.x + dx, newY = tank.y + dy;
        if (newX < 2) newX = 2;
        if (newX > 758) newX = 758;
        if (newY < 2) newY = 2;
        if (newY > 558) newY = 558;
        var oldX = tank.x, oldY = tank.y;
        tank.x = newX; tank.y = newY; tank.dir = newDir;
        for (var i = 0; i < bricks.length; i++) {
            if (collide({x: tank.x, y: tank.y, w: 40, h: 40}, bricks[i])) { tank.x = oldX; tank.y = oldY; break; }
        }
    }
    
    function shoot(tank, bullet, isP1) {
        if (bullet.active) return;
        if (isP1 && p1Delay > 0) return;
        if (!isP1 && p2Delay > 0) return;
        if (isP1) p1Delay = 15; else p2Delay = 15;
        bullet.active = true;
        if (tank.dir === 0) { bullet.x = tank.x + 16; bullet.y = tank.y; bullet.speedX = 0; bullet.speedY = -8; }
        else if (tank.dir === 1) { bullet.x = tank.x + 16; bullet.y = tank.y + 40; bullet.speedX = 0; bullet.speedY = 8; }
        else if (tank.dir === 2) { bullet.x = tank.x; bullet.y = tank.y + 16; bullet.speedX = -8; bullet.speedY = 0; }
        else { bullet.x = tank.x + 40; bullet.y = tank.y + 16; bullet.speedX = 8; bullet.speedY = 0; }
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'shoot', bullet: bullet, dir: tank.dir }));
    }
    
    function updateBullet(bullet, isP1Bullet) {
        if (!bullet.active) return;
        bullet.x += bullet.speedX; bullet.y += bullet.speedY;
        if (bullet.x < -50 || bullet.x > 850 || bullet.y < -50 || bullet.y > 650) { bullet.active = false; return; }
        var bulletRect = { x: bullet.x, y: bullet.y, w: 8, h: 8 };
        for (var i = 0; i < bricks.length; i++) {
            if (collide(bulletRect, bricks[i])) { bricks.splice(i, 1); bullet.active = false; if (isP1Bullet) { score += 10; updateUI(); } return; }
        }
        if (currentMode === 'pvp' && gameSource === 'offline' && p2 && collide(bulletRect, {x: p2.x, y: p2.y, w: 40, h: 40})) {
            p2.health--; bullet.active = false;
            if (isP1Bullet) { score += 50; updateUI(); }
            if (p2.health <= 0) { score += 200; updateUI(); gameOver = true; }
            return;
        }
        for (var entry of players) {
            var id = entry[0], player = entry[1];
            if (collide(bulletRect, {x: player.x, y: player.y, w: 40, h: 40})) {
                player.health--; bullet.active = false;
                if (isP1Bullet) { score += 50; updateUI(); }
                if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'damage', targetId: id, health: player.health }));
                if (player.health <= 0) { players.delete(id); score += 200; updateUI(); }
                return;
            }
        }
        for (var i = 0; i < enemies.length; i++) {
            if (collide(bulletRect, {x: enemies[i].x, y: enemies[i].y, w: 40, h: 40})) {
                enemies.splice(i, 1); bullet.active = false;
                if (isP1Bullet) { score += 100; updateUI(); } return;
            }
        }
    }
    
    function updateEnemies() {
        for (var i = 0; i < enemies.length; i++) {
            var e = enemies[i];
            e.moveTimer++; e.shootTimer++;
            if (e.moveTimer > 50) { e.moveTimer = 0; e.dir = Math.floor(Math.random() * 4); }
            var oldX = e.x, oldY = e.y;
            if (e.dir === 0) e.y -= 2; if (e.dir === 1) e.y += 2;
            if (e.dir === 2) e.x -= 2; if (e.dir === 3) e.x += 2;
            if (e.x < 2) e.x = 2; if (e.x > 758) e.x = 758;
            if (e.y < 2) e.y = 2; if (e.y > 400) e.y = 400;
            for (var k = 0; k < bricks.length; k++) {
                if (collide({x: e.x, y: e.y, w: 40, h: 40}, bricks[k])) { e.x = oldX; e.y = oldY; break; }
            }
            if (e.shootTimer > 45) {
                e.shootTimer = 0;
                var eb = { x: 0, y: 0, w: 8, h: 8, speedX: 0, speedY: 0 };
                if (e.dir === 0) { eb.x = e.x+16; eb.y = e.y; eb.speedX = 0; eb.speedY = -6; }
                else if (e.dir === 1) { eb.x = e.x+16; eb.y = e.y+40; eb.speedX = 0; eb.speedY = 6; }
                else if (e.dir === 2) { eb.x = e.x; eb.y = e.y+16; eb.speedX = -6; eb.speedY = 0; }
                else { eb.x = e.x+40; eb.y = e.y+16; eb.speedX = 6; eb.speedY = 0; }
                var bulletRect = { x: eb.x, y: eb.y, w: 8, h: 8 };
                if (collide(bulletRect, {x: p1.x, y: p1.y, w: 40, h: 40})) {
                    p1.health--; updateUI();
                    if (p1.health <= 0) gameOver = true;
                }
                for (var j = 0; j < bricks.length; j++) {
                    if (collide(bulletRect, bricks[j])) { bricks.splice(j, 1); break; }
                }
            }
        }
        if (enemies.length === 0 && !gameOver && (currentMode === 'bots' || currentMode === 'ctf')) {
            for (var i = 0; i < 3; i++) {
                enemies.push({ x: 100 + i * 250, y: 80, w: 40, h: 40, dir: 1, moveTimer: 0, shootTimer: Math.floor(Math.random() * 50) });
            }
        }
    }
    
    function updateCTF() {
        if (currentMode !== 'ctf') return;
        var flagRect = { x: flag.x, y: flag.y, w: flag.w, h: flag.h };
        var tankRect = { x: p1.x, y: p1.y, w: 40, h: 40 };
        if (!flag.captured && collide(tankRect, flagRect)) {
            flag.captured = true; flag.carrier = 'player';
            score += 150; updateUI();
        }
        if (flag.captured && flag.carrier === 'player') {
            var baseRect = { x: 50, y: 520, w: 30, h: 30 };
            if (collide(tankRect, baseRect)) {
                score += 500; updateUI();
                flag.captured = false; flag.carrier = null;
                flag.x = 700; flag.y = 80;
            } else { flag.x = p1.x + 6; flag.y = p1.y + 6; }
        }
    }
    
    function sendPosition() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'pos', x: p1.x, y: p1.y, dir: p1.dir, health: p1.health }));
        }
    }
    
    function updateGame() {
        if (gameOver || p1.health <= 0) { if (p1.health <= 0) gameOver = true; return; }
        if (keys.left) moveTank(p1, -4, 0, 2);
        if (keys.right) moveTank(p1, 4, 0, 3);
        if (keys.up) moveTank(p1, 0, -4, 0);
        if (keys.down) moveTank(p1, 0, 4, 1);
        if (p1Delay > 0) p1Delay--;
        if (keys.fire && !p1Bullet.active && p1Delay === 0) shoot(p1, p1Bullet, true);
        updateBullet(p1Bullet, true);
        if (currentMode === 'pvp' && gameSource === 'offline' && p2) {
            if (keysP2.left) moveTank(p2, -4, 0, 2);
            if (keysP2.right) moveTank(p2, 4, 0, 3);
            if (keysP2.up) moveTank(p2, 0, -4, 0);
            if (keysP2.down) moveTank(p2, 0, 4, 1);
            if (p2Delay > 0) p2Delay--;
            if (keysP2.fire && !p2Bullet.active && p2Delay === 0) shoot(p2, p2Bullet, false);
            updateBullet(p2Bullet, false);
        }
        if (currentMode === 'bots' || currentMode === 'ctf') updateEnemies();
        if (currentMode === 'ctf') updateCTF();
        if (gameSource === 'online' && ws && ws.readyState === WebSocket.OPEN) {
            var now = Date.now();
            if (now - lastSend > 50) { sendPosition(); lastSend = now; }
        }
    }
    
    function draw() {
        ctx.clearRect(0, 0, 800, 600);
        ctx.fillStyle = '#2d2a24'; ctx.fillRect(0, 0, 800, 600);
        for (var i = 0; i < bricks.length; i++) {
            var b = bricks[i];
            ctx.fillStyle = '#b87c3a'; ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.fillStyle = '#e6a155'; ctx.fillRect(b.x+2, b.y+2, b.w-4, 5);
        }
        if (currentMode === 'ctf') {
            if (!flag.captured || flag.carrier !== 'player') {
                ctx.fillStyle = '#dc3c2a'; ctx.fillRect(flag.x, flag.y, flag.w, flag.h);
                ctx.fillStyle = '#ffcc44'; ctx.font = 'bold 20px monospace'; ctx.fillText('🏁', flag.x+5, flag.y+22);
            }
            ctx.fillStyle = '#88aa44'; ctx.fillRect(50, 520, 30, 30);
            ctx.fillStyle = 'gold'; ctx.fillText('🏠', 57, 542);
        }
        var colorIndex = 0;
        var colors = ['#c44f2a', '#2a6ec4', '#c4a42a', '#9e2ac4', '#44cc88', '#cc44aa', '#44aacc', '#cc8844'];
        for (var entry of players) {
            var player = entry[1];
            ctx.fillStyle = colors[colorIndex % colors.length];
            ctx.fillRect(player.x, player.y, 40, 40);
            ctx.fillStyle = '#ffaa66';
            var ex = player.x + 20, ey = player.y + 20;
            if (player.dir === 0) ctx.fillRect(ex-3, player.y-6, 6, 10);
            else if (player.dir === 1) ctx.fillRect(ex-3, player.y+36, 6, 10);
            else if (player.dir === 2) ctx.fillRect(player.x-6, ey-3, 10, 6);
            else ctx.fillRect(player.x+36, ey-3, 10, 6);
            ctx.fillStyle = 'white'; ctx.font = '11px monospace';
            ctx.fillText('❤️'+player.health, player.x+3, player.y-5);
            colorIndex++;
        }
        ctx.fillStyle = '#4f9e32'; ctx.fillRect(p1.x, p1.y, 40, 40);
        ctx.fillStyle = '#f5d742';
        var cx = p1.x + 20, cy = p1.y + 20;
        if (p1.dir === 0) ctx.fillRect(cx-4, p1.y-8, 8, 12);
        else if (p1.dir === 1) ctx.fillRect(cx-4, p1.y+32, 8, 12);
        else if (p1.dir === 2) ctx.fillRect(p1.x-8, cy-4, 12, 8);
        else ctx.fillRect(p1.x+32, cy-4, 12, 8);
        if (currentMode === 'pvp' && gameSource === 'offline' && p2) {
            ctx.fillStyle = '#c44f2a'; ctx.fillRect(p2.x, p2.y, 40, 40);
            ctx.fillStyle = '#ffaa66';
            var ex = p2.x + 20, ey = p2.y + 20;
            if (p2.dir === 0) ctx.fillRect(ex-3, p2.y-6, 6, 10);
            else if (p2.dir === 1) ctx.fillRect(ex-3, p2.y+36, 6, 10);
            else if (p2.dir === 2) ctx.fillRect(p2.x-6, ey-3, 10, 6);
            else ctx.fillRect(p2.x+36, ey-3, 10, 6);
            ctx.fillStyle = 'white'; ctx.font = '11px monospace';
            ctx.fillText('❤️'+p2.health, p2.x+3, p2.y-5);
        }
        for (var i = 0; i < enemies.length; i++) {
            var e = enemies[i];
            ctx.fillStyle = '#bd6a32'; ctx.fillRect(e.x, e.y, 40, 40);
            ctx.fillStyle = '#d17e42';
            var ex = e.x + 20, ey = e.y + 20;
            if (e.dir === 0) ctx.fillRect(ex-3, e.y-6, 6, 10);
            else if (e.dir === 1) ctx.fillRect(ex-3, e.y+36, 6, 10);
            else if (e.dir === 2) ctx.fillRect(e.x-6, ey-3, 10, 6);
            else ctx.fillRect(e.x+36, ey-3, 10, 6);
        }
        if (p1Bullet.active) { ctx.fillStyle = '#ffcc44'; ctx.fillRect(p1Bullet.x, p1Bullet.y, 8, 8); }
        if (currentMode === 'pvp' && gameSource === 'offline' && p2Bullet.active) { ctx.fillStyle = '#ff6644'; ctx.fillRect(p2Bullet.x, p2Bullet.y, 8, 8); }
        if (gameOver || p1.health <= 0) {
            ctx.font = 'bold 36px monospace'; ctx.fillStyle = '#f0d890'; ctx.fillText('GAME OVER', 280, 280);
            ctx.font = '14px monospace'; ctx.fillStyle = '#c9aa6a'; ctx.fillText('R - рестарт', 340, 340);
        }
    }
    
    // ========== ВЫБОР ==========
    window.selectSource = function(source, btn) {
        selectedSource = source;
        gameSource = source;
        var allBtns = document.querySelectorAll('.mode-btn');
        for (var i = 0; i < allBtns.length; i++) allBtns[i].classList.remove('selected');
        btn.classList.add('selected');
        
        if (source === 'offline') {
            document.getElementById('offlineModes').style.display = 'block';
            document.getElementById('onlineModes').style.display = 'none';
        } else {
            document.getElementById('offlineModes').style.display = 'none';
            document.getElementById('onlineModes').style.display = 'block';
        }
    };
    
    window.selectMode = function(mode, btn) {
        selectedMode = mode;
        var container = (selectedSource === 'offline') ? 'offlineModes' : 'onlineModes';
        var allBtns = document.getElementById(container).querySelectorAll('.mode-btn');
        for (var i = 0; i < allBtns.length; i++) allBtns[i].classList.remove('selected');
        btn.classList.add('selected');
    };
    
    window.selectMap = function(mapNum, btn) {
        selectedMap = mapNum; currentMap = mapNum;
        var allBtns = document.querySelectorAll('.map-btn');
        for (var i = 0; i < allBtns.length; i++) allBtns[i].classList.remove('selected');
        btn.classList.add('selected');
    };
    
    window.selectPlayers = function(num, btn) {
        selectedPlayers = num; maxPlayers = num;
        var allBtns = document.querySelectorAll('.players-btn');
        for (var i = 0; i < allBtns.length; i++) allBtns[i].classList.remove('selected');
        btn.classList.add('selected');
    };
    
    window.startSelectedMode = function() {
        if (!selectedSource) { alert('Выбери способ игры!'); return; }
        if (!selectedMode) { alert('Выбери режим!'); return; }
        
        if (selectedSource === 'online') {
            var ip = document.getElementById('serverIp').value;
            var port = document.getElementById('serverPort').value;
            connectToServer(ip, port);
        } else {
            currentMode = selectedMode;
            currentMap = selectedMap;
            gameSource = 'offline';
            maxPlayers = 1;
            gameRunning = true;
            
            var modeText = '';
            if (selectedMode === 'bots') modeText = '🎮 БОТЫ';
            if (selectedMode === 'ctf') modeText = '🏁 ФЛАГ';
            if (selectedMode === 'pvp') modeText = '⚔️ PVP';
            document.getElementById('modeLabel').innerText = modeText;
            
            restart();
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('game').classList.remove('hidden');
        }
    };
    
    function connectToServer(ip, port) {
        var url = 'ws://' + ip + ':' + port;
        document.getElementById('netStatus').innerText = '🔄 Подключение...';
        
        try { ws = new WebSocket(url); } catch(e) { document.getElementById('netStatus').innerText = '❌ Ошибка!'; return; }
        
        ws.onopen = function() {
            document.getElementById('netStatus').innerText = '✅ Подключено!';
            currentMode = selectedMode;
            gameSource = 'online';
            currentMap = selectedMap;
            maxPlayers = selectedPlayers;
            gameRunning = true;
            
            var modeText = '';
            if (selectedMode === 'bots') modeText = '🌐 БОТЫ';
            if (selectedMode === 'ctf') modeText = '🌐 ФЛАГ';
            if (selectedMode === 'pvp') modeText = '🌐 PVP';
            document.getElementById('modeLabel').innerText = modeText;
            
            restart();
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('game').classList.remove('hidden');
            document.getElementById('onlineStatus').innerText = '👥 Ожидание игроков...';
        };
        
        ws.onmessage = function(event) {
            try {
                var data = JSON.parse(event.data);
                if (data.type === 'id') { myId = data.id; document.getElementById('onlineStatus').innerText = '🎮 ID: ' + myId; }
                if (data.type === 'pos' && data.playerId !== myId) {
                    if (!players.has(data.playerId)) {
                        players.set(data.playerId, { x: data.x, y: data.y, dir: data.dir, health: data.health });
                    } else {
                        var p = players.get(data.playerId);
                        p.x = data.x; p.y = data.y; p.dir = data.dir; p.health = data.health;
                    }
                    document.getElementById('onlineStatus').innerText = '👥 Игроков: ' + (players.size + 1) + '/' + maxPlayers;
                    updateUI();
                }
                if (data.type === 'damage' && data.targetId === myId) {
                    p1.health = data.health; updateUI();
                    if (p1.health <= 0) gameOver = true;
                }
                if (data.type === 'disconnect') { players.delete(data.playerId); updateUI(); }
            } catch(e) {}
        };
        
        ws.onerror = function() { document.getElementById('netStatus').innerText = '❌ Ошибка!'; };
        ws.onclose = function() { if (gameRunning) { document.getElementById('onlineStatus').innerText = '⚠️ Отключено!'; setTimeout(exitToMenu, 2000); } };
    }
    
    function exitToMenu() {
        gameRunning = false;
        if (ws) { ws.close(); ws = null; }
        players.clear();
        document.getElementById('menu').classList.remove('hidden');
        document.getElementById('game').classList.add('hidden');
    }
    
    document.addEventListener('keydown', function(e) {
        if (!gameRunning) return;
        if (e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'ArrowRight') keys.right = true;
        if (e.key === 'ArrowUp') keys.up = true;
        if (e.key === 'ArrowDown') keys.down = true;
        if (e.key === ' ') { keys.fire = true; e.preventDefault(); }
        if (currentMode === 'pvp' && gameSource === 'offline') {
            if (e.key === 'a') keysP2.left = true;
            if (e.key === 'd') keysP2.right = true;
            if (e.key === 'w') keysP2.up = true;
            if (e.key === 's') keysP2.down = true;
            if (e.key === 'x') { keysP2.fire = true; e.preventDefault(); }
        }
        if (e.key === 'r' || e.key === 'R') restart();
        if (e.key === 'Escape') exitToMenu();
    });
    
    document.addEventListener('keyup', function(e) {
        if (e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'ArrowRight') keys.right = false;
        if (e.key === 'ArrowUp') keys.up = false;
        if (e.key === 'ArrowDown') keys.down = false;
        if (e.key === ' ') { keys.fire = false; }
        if (currentMode === 'pvp' && gameSource === 'offline') {
            if (e.key === 'a') keysP2.left = false;
            if (e.key === 'd') keysP2.right = false;
            if (e.key === 'w') keysP2.up = false;
            if (e.key === 's') keysP2.down = false;
            if (e.key === 'x') { keysP2.fire = false; }
        }
    });
    
    function setupTouch() {
        var btnUp = document.getElementById('btnUp'), btnDown = document.getElementById('btnDown');
        var btnLeft = document.getElementById('btnLeft'), btnRight = document.getElementById('btnRight');
        var btnFire = document.getElementById('btnFire'), btnRestart = document.getElementById('btnRestart');
        var backBtn = document.getElementById('backBtn');
        function attachButton(btn, onStart, onEnd) {
            if (!btn) return;
            btn.addEventListener('touchstart', function(e) { e.preventDefault(); onStart(); }, { passive: false });
            btn.addEventListener('touchend', function(e) { e.preventDefault(); onEnd(); }, { passive: false });
            btn.addEventListener('touchcancel', function(e) { e.preventDefault(); onEnd(); }, { passive: false });
            btn.addEventListener('mousedown', function(e) { e.preventDefault(); onStart(); });
            btn.addEventListener('mouseup', function(e) { e.preventDefault(); onEnd(); });
            btn.addEventListener('mouseleave', function(e) { e.preventDefault(); onEnd(); });
        }
        attachButton(btnUp, function() { keys.up = true; }, function() { keys.up = false; });
        attachButton(btnDown, function() { keys.down = true; }, function() { keys.down = false; });
        attachButton(btnLeft, function() { keys.left = true; }, function() { keys.left = false; });
        attachButton(btnRight, function() { keys.right = true; }, function() { keys.right = false; });
        btnFire.addEventListener('touchstart', function(e) { e.preventDefault(); keys.fire = true; }, { passive: false });
        btnFire.addEventListener('touchend', function(e) { e.preventDefault(); keys.fire = false; }, { passive: false });
        btnFire.addEventListener('touchcancel', function(e) { e.preventDefault(); keys.fire = false; }, { passive: false });
        btnFire.addEventListener('mousedown', function(e) { e.preventDefault(); keys.fire = true; });
        btnFire.addEventListener('mouseup', function(e) { e.preventDefault(); keys.fire = false; });
        btnFire.addEventListener('mouseleave', function(e) { e.preventDefault(); keys.fire = false; });
        btnRestart.addEventListener('click', function(e) { e.preventDefault(); restart(); });
        btnRestart.addEventListener('touchstart', function(e) { e.preventDefault(); restart(); }, { passive: false });
        backBtn.addEventListener('click', function(e) { e.preventDefault(); exitToMenu(); });
        backBtn.addEventListener('touchstart', function(e) { e.preventDefault(); exitToMenu(); }, { passive: false });
    }
    
    setupTouch();
    
    function gameLoop() {
        if (gameRunning) { updateGame(); draw(); }
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
</script>
</body>
</html>
