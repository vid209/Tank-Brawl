<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ТАНКИ</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #0a0c0e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace;
        }
        canvas {
            display: block;
            box-shadow: 0 0 0 3px #5a4a2e, 0 10px 25px black;
            border-radius: 8px;
            cursor: none;
        }
        .info {
            position: fixed;
            top: 15px;
            left: 20px;
            background: #1e1b16;
            padding: 6px 14px;
            border-radius: 20px;
            color: #f5e2b0;
            font-weight: bold;
            font-size: 20px;
            gap: 25px;
            display: flex;
            font-family: monospace;
            z-index: 10;
            pointer-events: none;
        }
        .restart {
            position: fixed;
            bottom: 18px;
            left: 20px;
            background: #2c241a;
            padding: 5px 14px;
            border-radius: 30px;
            color: #cfb87c;
            font-size: 15px;
            font-weight: bold;
            pointer-events: none;
            font-family: monospace;
        }
        kbd {
            background: #000000aa;
            padding: 2px 8px;
            border-radius: 30px;
            margin: 0 3px;
            color: #ffdd99;
        }
        @media (max-width: 850px) {
            .info { font-size: 16px; top: 8px; left: 8px; }
            .restart { font-size: 11px; }
        }
    </style>
</head>
<body>
<div class="info">
    <span>❤️ <span id="healthDisplay">3</span></span>
    <span>⭐ <span id="scoreDisplay">0</span></span>
</div>
<div class="restart">
    🔁 <kbd>R</kbd> перезапуск
</div>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
    (function(){
        // ----- КАНВАС -----
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // ========== ПЕРЕМЕННЫЕ ==========
        let gameOver = false;
        let health = 3;
        let score = 0;
        
        // ----- ТАНК ИГРОКА -----
        let tank = {
            x: 380, y: 520,
            w: 40, h: 40,
            dir: 0      // 0-вверх, 1-вниз, 2-влево, 3-вправо
        };
        
        // ----- ПУЛЯ ИГРОКА -----
        let bullet = {
            active: false,
            x: 0, y: 0,
            speedX: 0, speedY: 0
        };
        let shootDelay = 0;
        
        // ----- ПУЛИ ВРАГОВ -----
        let enemyBullets = [];
        
        // ----- ВРАГИ -----
        let enemies = [];
        
        // ----- КИРПИЧИ -----
        let bricks = [];
        
        // ----- УПРАВЛЕНИЕ (клавиши) -----
        const keys = {
            ArrowLeft: false, ArrowRight: false,
            ArrowUp: false, ArrowDown: false,
            Space: false
        };
        
        // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
        function updateUI() {
            document.getElementById('healthDisplay').innerText = health;
            document.getElementById('scoreDisplay').innerText = score;
        }
        
        // столкновение (прямоугольники)
        function collide(r1, r2) {
            return !(r2.x > r1.x + r1.w ||
                r2.x + r2.w < r1.x ||
                r2.y > r1.y + r1.h ||
                r2.y + r2.h < r1.y);
        }
        
        // ========== ПОСТРОЕНИЕ КИРПИЧЕЙ (как в оригинале) ==========
        function buildBricks() {
            let arr = [];
            // рамка (верх/низ)
            for (let i = 0; i < 20; i++) {
                arr.push({ x: i * 42, y: 0, w: 38, h: 38 });
                arr.push({ x: i * 42, y: 562, w: 38, h: 38 });
            }
            // рамка (лево/право)
            for (let i = 0; i < 15; i++) {
                arr.push({ x: 0, y: i * 42, w: 38, h: 38 });
                arr.push({ x: 762, y: i * 42, w: 38, h: 38 });
            }
            // препятствия внутри
            for (let i = 3; i < 18; i += 4) {
                for (let j = 4; j < 10; j += 2) {
                    arr.push({ x: i * 42, y: j * 42, w: 38, h: 38 });
                }
            }
            return arr;
        }
        
        // ========== СОЗДАТЬ ВРАГОВ ==========
        function createEnemies() {
            let arr = [];
            for (let i = 0; i < 3; i++) {
                arr.push({
                    x: 100 + i * 250, y: 80,
                    w: 40, h: 40,
                    dir: 1,           // направление (1=вниз)
                    moveTimer: 0,
                    shootTimer: Math.floor(Math.random() * 50)
                });
            }
            return arr;
        }
        
        // ========== ПЕРЕЗАПУСК ==========
        function restartGame() {
            gameOver = false;
            health = 3;
            score = 0;
            updateUI();
            
            tank = { x: 380, y: 520, w: 40, h: 40, dir: 0 };
            bullet = { active: false, x: 0, y: 0, speedX: 0, speedY: 0 };
            shootDelay = 0;
            enemyBullets = [];
            
            bricks = buildBricks();
            enemies = createEnemies();
        }
        
        // ========== ЛОГИКА ДВИЖЕНИЯ ТАНКА + СТОЛКНОВЕНИЕ ==========
        function moveTank(dx, dy, newDir) {
            let newX = tank.x + dx;
            let newY = tank.y + dy;
            // границы
            if (newX < 2) newX = 2;
            if (newX > 758) newX = 758;
            if (newY < 2) newY = 2;
            if (newY > 558) newY = 558;
            
            let oldX = tank.x, oldY = tank.y;
            tank.x = newX;
            tank.y = newY;
            tank.dir = newDir;
            
            // столкновение с кирпичами
            for (let b of bricks) {
                if (collide({x: tank.x, y: tank.y, w: tank.w, h: tank.h}, b)) {
                    tank.x = oldX;
                    tank.y = oldY;
                    break;
                }
            }
        }
        
        // ========== ВЫСТРЕЛ ИГРОКА ==========
        function shoot() {
            if (bullet.active) return;
            if (shootDelay > 0) return;
            shootDelay = 15;
            bullet.active = true;
            
            if (tank.dir == 0) { // вверх
                bullet.x = tank.x + 16;
                bullet.y = tank.y;
                bullet.speedX = 0; bullet.speedY = -8;
            } else if (tank.dir == 1) { // вниз
                bullet.x = tank.x + 16;
                bullet.y = tank.y + 40;
                bullet.speedX = 0; bullet.speedY = 8;
            } else if (tank.dir == 2) { // влево
                bullet.x = tank.x;
                bullet.y = tank.y + 16;
                bullet.speedX = -8; bullet.speedY = 0;
            } else { // вправо
                bullet.x = tank.x + 40;
                bullet.y = tank.y + 16;
                bullet.speedX = 8; bullet.speedY = 0;
            }
        }
        
        // ========== ОБНОВЛЕНИЕ ПУЛИ ИГРОКА ==========
        function updateBullet() {
            if (!bullet.active) return;
            bullet.x += bullet.speedX;
            bullet.y += bullet.speedY;
            
            // выход за границы
            if (bullet.x < -50 || bullet.x > 850 || bullet.y < -50 || bullet.y > 650) {
                bullet.active = false;
                return;
            }
            
            let bulletRect = { x: bullet.x, y: bullet.y, w: 8, h: 8 };
            
            // попадание в кирпичи
            for (let i = 0; i < bricks.length; i++) {
                if (collide(bulletRect, bricks[i])) {
                    bricks.splice(i,1);
                    bullet.active = false;
                    score += 10;
                    updateUI();
                    return;
                }
            }
            
            // попадание во врагов
            if (bullet.active) {
                for (let i = 0; i < enemies.length; i++) {
                    let e = enemies[i];
                    if (collide(bulletRect, {x: e.x, y: e.y, w: e.w, h: e.h})) {
                        enemies.splice(i,1);
                        bullet.active = false;
                        score += 100;
                        updateUI();
                        return;
                    }
                }
            }
        }
        
        // ========== ВРАГИ: ДВИЖЕНИЕ И СТРЕЛЬБА ==========
        function updateEnemies() {
            for (let i = 0; i < enemies.length; i++) {
                let e = enemies[i];
                e.moveTimer++;
                e.shootTimer++;
                
                // смена направления
                if (e.moveTimer > 50) {
                    e.moveTimer = 0;
                    e.dir = Math.floor(Math.random() * 4);
                }
                
                let oldX = e.x, oldY = e.y;
                // движение
                if (e.dir == 0) e.y -= 2;
                if (e.dir == 1) e.y += 2;
                if (e.dir == 2) e.x -= 2;
                if (e.dir == 3) e.x += 2;
                
                // границы
                if (e.x < 2) e.x = 2;
                if (e.x > 758) e.x = 758;
                if (e.y < 2) e.y = 2;
                if (e.y > 400) e.y = 400;
                
                // столкновение с кирпичами
                for (let b of bricks) {
                    if (collide({x: e.x, y: e.y, w: e.w, h: e.h}, b)) {
                        e.x = oldX;
                        e.y = oldY;
                        break;
                    }
                }
                
                // СТРЕЛЬБА ВРАГА
                if (e.shootTimer > 40) {
                    e.shootTimer = 0;
                    let eb = {
                        x: 0, y: 0, w: 8, h: 8,
                        speedX: 0, speedY: 0,
                        active: true
                    };
                    if (e.dir == 0) {
                        eb.x = e.x + 16;
                        eb.y = e.y;
                        eb.speedX = 0; eb.speedY = -6;
                    } else if (e.dir == 1) {
                        eb.x = e.x + 16;
                        eb.y = e.y + 40;
                        eb.speedX = 0; eb.speedY = 6;
                    } else if (e.dir == 2) {
                        eb.x = e.x;
                        eb.y = e.y + 16;
                        eb.speedX = -6; eb.speedY = 0;
                    } else {
                        eb.x = e.x + 40;
                        eb.y = e.y + 16;
                        eb.speedX = 6; eb.speedY = 0;
                    }
                    enemyBullets.push(eb);
                }
            }
        }
        
        // ========== ОБНОВЛЕНИЕ ПУЛЬ ВРАГОВ ==========
        function updateEnemyBullets() {
            for (let i = 0; i < enemyBullets.length; i++) {
                let eb = enemyBullets[i];
                eb.x += eb.speedX;
                eb.y += eb.speedY;
                
                if (eb.x < -50 || eb.x > 850 || eb.y < -50 || eb.y > 650) {
                    enemyBullets.splice(i,1);
                    i--;
                    continue;
                }
                
                let bulletRect = { x: eb.x, y: eb.y, w: eb.w, h: eb.h };
                let tankRect = { x: tank.x, y: tank.y, w: tank.w, h: tank.h };
                
                // попадание в игрока
                if (collide(bulletRect, tankRect)) {
                    health--;
                    updateUI();
                    enemyBullets.splice(i,1);
                    i--;
                    if (health <= 0) {
                        gameOver = true;
                    }
                    continue;
                }
                
                // попадание в кирпичи
                for (let j = 0; j < bricks.length; j++) {
                    if (collide(bulletRect, bricks[j])) {
                        bricks.splice(j,1);
                        enemyBullets.splice(i,1);
                        i--;
                        break;
                    }
                }
            }
        }
        
        // ========== СПАВН ВРАГОВ (если все мертвы) ==========
        function respawnEnemies() {
            if (enemies.length === 0 && !gameOver) {
                for (let i = 0; i < 3; i++) {
                    enemies.push({
                        x: 100 + i * 250, y: 80,
                        w: 40, h: 40,
                        dir: 1,
                        moveTimer: 0,
                        shootTimer: Math.floor(Math.random() * 50)
                    });
                }
            }
        }
        
        // ========== ОСНОВНОЕ ОБНОВЛЕНИЕ (ЛОГИКА) ==========
        function update() {
            if (gameOver) return;
            if (health <= 0) {
                gameOver = true;
                return;
            }
            
            // ---------- управление ----------
            if (keys.ArrowLeft) moveTank(-4, 0, 2);
            if (keys.ArrowRight) moveTank(4, 0, 3);
            if (keys.ArrowUp) moveTank(0, -4, 0);
            if (keys.ArrowDown) moveTank(0, 4, 1);
            
            // перезарядка выстрела
            if (shootDelay > 0) shootDelay--;
            if (keys.Space) shoot();
            
            // обновление пули игрока
            updateBullet();
            
            // враги
            updateEnemies();
            
            // пули врагов
            updateEnemyBullets();
            
            // респавн волн
            respawnEnemies();
        }
        
        // ========== ОТРИСОВКА ==========
        function draw() {
            ctx.clearRect(0, 0, 800, 600);
            
            // фон (земля)
            ctx.fillStyle = '#2d2a24';
            ctx.fillRect(0,0,800,600);
            ctx.fillStyle = '#49432e';
            for(let i=0;i<300;i++) ctx.fillRect((i*131)%800, (i*97)%600, 3, 3);
            
            // кирпичи
            for(let b of bricks) {
                ctx.fillStyle = '#b87c3a';
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.fillStyle = '#8b5a2b';
                ctx.fillRect(b.x+4, b.y+4, b.w-8, b.h-8);
                ctx.fillStyle = '#e6a155';
                ctx.fillRect(b.x+2, b.y+2, b.w-4, 5);
            }
            
            // танк игрока
            ctx.fillStyle = '#4f9e32';
            ctx.fillRect(tank.x, tank.y, tank.w, tank.h);
            ctx.fillStyle = '#32781e';
            ctx.fillRect(tank.x+6, tank.y+6, tank.w-12, tank.h-12);
            ctx.fillStyle = '#f5d742';
            let cx = tank.x + tank.w/2;
            let cy = tank.y + tank.h/2;
            if (tank.dir === 0) ctx.fillRect(cx-4, tank.y-8, 8, 12);
            else if (tank.dir === 1) ctx.fillRect(cx-4, tank.y+tank.h-4, 8, 12);
            else if (tank.dir === 2) ctx.fillRect(tank.x-8, cy-4, 12, 8);
            else ctx.fillRect(tank.x+tank.w-4, cy-4, 12, 8);
            
            // враги
            for(let e of enemies) {
                ctx.fillStyle = '#bd6a32';
                ctx.fillRect(e.x, e.y, e.w, e.h);
                ctx.fillStyle = '#87461d';
                ctx.fillRect(e.x+5, e.y+5, e.w-10, e.h-10);
                ctx.fillStyle = '#d17e42';
                let ex = e.x + e.w/2;
                let ey = e.y + e.h/2;
                if (e.dir === 0) ctx.fillRect(ex-3, e.y-6, 6, 10);
                else if (e.dir === 1) ctx.fillRect(ex-3, e.y+e.h-4, 6, 10);
                else if (e.dir === 2) ctx.fillRect(e.x-6, ey-3, 10, 6);
                else ctx.fillRect(e.x+e.w-4, ey-3, 10, 6);
            }
            
            // пуля игрока
            if(bullet.active) {
                ctx.fillStyle = '#ffcc44';
                ctx.fillRect(bullet.x, bullet.y, 8, 8);
                ctx.fillStyle = '#ffaa22';
                ctx.fillRect(bullet.x+2, bullet.y+2, 4, 4);
            }
            
            // пули врагов
            for(let eb of enemyBullets) {
                ctx.fillStyle = '#ff6644';
                ctx.fillRect(eb.x, eb.y, eb.w, eb.h);
                ctx.fillStyle = '#ffaa77';
                ctx.fillRect(eb.x+2, eb.y+2, 4, 4);
            }
            
            // GAME OVER
            if(gameOver || health <= 0) {
                ctx.font = 'bold 46monospace';
                ctx.fillStyle = '#ddbb88';
                ctx.shadowBlur = 0;
                ctx.fillText('GAME OVER', 250, 280);
                ctx.font = '18monospace';
                ctx.fillStyle = '#bfa56a';
                ctx.fillText('нажми R', 360, 350);
            }
            
            // мини-HUD на поле
            ctx.font = 'bold 18monospace';
            ctx.fillStyle = '#f7ecc7';
            ctx.fillText('❤️ '+health, 20, 50);
            ctx.fillText('⭐ '+score, 110, 50);
        }
        
        // ========== КЛАВИАТУРА ==========
        function keydownHandler(e) {
            let key = e.key;
            if (key === 'ArrowLeft') keys.ArrowLeft = true;
            if (key === 'ArrowRight') keys.ArrowRight = true;
            if (key === 'ArrowUp') keys.ArrowUp = true;
            if (key === 'ArrowDown') keys.ArrowDown = true;
            if (key === ' ' || key === 'Space') {
                keys.Space = true;
                e.preventDefault();
            }
            if (key === 'r' || key === 'R') {
                restartGame();
                e.preventDefault();
            }
        }
        
        function keyupHandler(e) {
            let key = e.key;
            if (key === 'ArrowLeft') keys.ArrowLeft = false;
            if (key === 'ArrowRight') keys.ArrowRight = false;
            if (key === 'ArrowUp') keys.ArrowUp = false;
            if (key === 'ArrowDown') keys.ArrowDown = false;
            if (key === ' ' || key === 'Space') {
                keys.Space = false;
                e.preventDefault();
            }
        }
        
        window.addEventListener('keydown', keydownHandler);
        window.addEventListener('keyup', keyupHandler);
        
        // блокировка скролла при пробеле
        canvas.addEventListener('keydown', (e) => { if(e.key === ' ') e.preventDefault(); });
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());
        
        // ========== ЗАПУСК ==========
        restartGame();
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        gameLoop();
    })();
</script>
</body>
</html>
